# /etc/nginx/sites-available/yvtech.com.br
# O HTTPS (porta 443) e o redirecionamento são acrescentados pelo certbot:
#   certbot --nginx -d yvtech.com.br -d www.yvtech.com.br --redirect
server {
    listen 80;
    server_name yvtech.com.br www.yvtech.com.br;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
