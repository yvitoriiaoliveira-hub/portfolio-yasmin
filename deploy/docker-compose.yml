# Portfólio na VPS — fica em /opt/portfolio/docker-compose.yml
# Segredos ficam em /opt/portfolio/.env (nunca no Git). Modelo: deploy/.env.vps.example
name: portfolio

services:
  web:
    image: portfolio-yasmin:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m

volumes:
  pgdata:
